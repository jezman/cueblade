[package]
name = "cueblade"
description = "A fast, safe, pure-Rust FLAC image splitter driven by CUE sheets with metadata preservation and atomic writes"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jezman/cueblade"
readme = "README.md"
keywords = ["flac", "cue", "audio", "splitter", "lossless"]
categories = ["multimedia::audio", "command-line-utilities"]
exclude = [
    "tests/fixtures/*.b64",
    ".github/",
    "ROADMAP.md",
]

[dependencies]
chardetng = "1"
clap = { version = "4", features = ["derive"] }
claxon = "0.4"
encoding_rs = "0.8"
flacenc = "0.5"
metaflac = "0.2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
winnow = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
base64 = "0.23"
